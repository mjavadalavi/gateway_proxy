services:
  web:
    build:
      context: .
      network: host
      args:
        http_proxy: http://127.0.0.1:8118
        https_proxy: http://127.0.0.1:8118
        no_proxy: localhost,127.0.0.1
    container_name: gateway-proxy
    restart: unless-stopped
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
    ports:
      - "127.0.0.1:${WEB_PORT:-8090}:8000"
    env_file:
      - .env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/',timeout=3).status==200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - apps-network

networks:
  apps-network:
    external: true
    name: apps-network
